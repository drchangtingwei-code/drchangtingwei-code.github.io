name: Notify IndexNow

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "assets/**"
      - "llms.txt"
      - "robots.txt"
      - "sitemap.xml"
      - "sitemap.txt"
      - "cbb558b64518180c2841e18dc6fc80ad.txt"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the IndexNow key to be live
        shell: bash
        run: |
          for attempt in {1..18}; do
            status="$(curl --silent --connect-timeout 10 --max-time 20 --output /dev/null --write-out '%{http_code}' https://drchangtingwei.com/cbb558b64518180c2841e18dc6fc80ad.txt)" || status="000"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "IndexNow key file was not available after waiting for GitHub Pages."
          exit 1

      - name: Submit changed site URLs to IndexNow
        shell: bash
        run: |
          curl --fail-with-body --retry 3 --request POST \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @- \
            https://api.indexnow.org/indexnow <<'JSON'
          {
            "host": "drchangtingwei.com",
            "key": "cbb558b64518180c2841e18dc6fc80ad",
            "keyLocation": "https://drchangtingwei.com/cbb558b64518180c2841e18dc6fc80ad.txt",
            "urlList": [
              "https://drchangtingwei.com/",
              "https://drchangtingwei.com/appointment/",
              "https://drchangtingwei.com/about/",
              "https://drchangtingwei.com/thoracic/",
              "https://drchangtingwei.com/bariatric/",
              "https://drchangtingwei.com/en/",
              "https://drchangtingwei.com/services.html",
              "https://drchangtingwei.com/prepare/",
              "https://drchangtingwei.com/articles/",
              "https://drchangtingwei.com/articles/pulmonary-nodules-follow-up.html",
              "https://drchangtingwei.com/articles/esophageal-cancer.html",
              "https://drchangtingwei.com/articles/reflux-hiatal-hernia.html",
              "https://drchangtingwei.com/articles/barrett-esophagus.html",
              "https://drchangtingwei.com/articles/esophageal-foreign-body.html",
              "https://drchangtingwei.com/articles/lung-nodule-biopsy-surgery.html",
              "https://drchangtingwei.com/articles/mediastinal-tumor.html",
              "https://drchangtingwei.com/articles/bariatric-surgery-assessment.html"
            ]
          }
          JSON
